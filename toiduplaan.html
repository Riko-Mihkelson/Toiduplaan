<title>Nädala Toiduplaan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<meta name="theme-color" content="#d93d23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Toiduplaan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: samm-sammuline viisard – üks küsimus lehe kohta, sammuriba üleval, edasi/tagasi all; viimased lehed: menüü ja tšekk-stiilis ostunimekiri */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#1f1b18; --muted:#6e625c; --line:#f0e4de;
  --primary:#d93d23; --primary-soft:#fff4ef; --accent:#3fa34d; --accent-soft:#eaf6ec;
  --no:#7a6f69; --no-soft:#f2eeec; --paper:#fffaf6; --on-primary:#ffffff; --accent-ink:#2b7a37;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17120f; --surface:#211a16; --ink:#f5eeea; --muted:#b3a59e; --line:#3a2e28;
  --primary:#ff6a4d; --primary-soft:#3a1f18; --accent:#6ccb78; --accent-soft:#1e3322;
  --no:#a79a93; --no-soft:#2c2421; --paper:#1e1814; --on-primary:#1a0f0b; --accent-ink:#6ccb78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120f; --surface:#211a16; --ink:#f5eeea; --muted:#b3a59e; --line:#3a2e28;
  --primary:#ff6a4d; --primary-soft:#3a1f18; --accent:#6ccb78; --accent-soft:#1e3322;
  --no:#a79a93; --no-soft:#2c2421; --paper:#1e1814; --on-primary:#1a0f0b; --accent-ink:#6ccb78; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.wrap.wide{max-width:1180px}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;margin:0}
.brand span{color:var(--primary)}

/* sammuriba */
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps li{flex:1 1 0;min-width:72px}
.steps button{width:100%;border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.steps button::before{content:"";display:block;height:4px;border-radius:2px;background:var(--line)}
.steps button.done::before{background:var(--accent)}
.steps button.cur{color:var(--ink);font-weight:600}
.steps button.cur::before{background:var(--primary)}
.steps button:disabled{cursor:default}

.page{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-ink);margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.08;margin:0;letter-spacing:-.02em;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:60ch}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 10px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font:inherit;display:flex;flex-direction:column;gap:4px;min-width:0}
.card b{font-family:var(--f-display);font-weight:700;font-size:20px}
.card small{font-size:13px;color:var(--muted)}
.card p{margin:4px 0 0;color:var(--ink);font-size:15px;line-height:1.45}
.card .price{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--primary);margin-top:6px}
.card .price-sub{font-size:14px;color:var(--muted);display:block}
.card .prices{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:4px}
.card .prices > span{display:flex;flex-direction:column}
.card .price{font-size:30px !important}
.card .tier-week{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px;color:var(--ink);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card .tier-week b{font-variant-numeric:tabular-nums}
.tgroup{display:flex;flex-direction:column;gap:10px}
.tgroup h2{font-size:16px}
.card[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.card:hover{border-color:var(--primary)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip[data-s="like"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip[data-s="no"]{background:var(--no-soft);border-color:var(--no);color:var(--no);text-decoration:line-through}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.legend span b{color:var(--accent-ink)} .legend span i{color:var(--no);font-style:normal;font-weight:600}

.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:max-content}
.stepper button{border:0;background:var(--bg);color:var(--ink);width:48px;height:48px;font-size:22px;cursor:pointer}
.stepper output{min-width:56px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.checks{display:flex;flex-direction:column;gap:10px}
.checks label{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:16px}
.checks input{accent-color:var(--primary);width:20px;height:20px}

/* edasi/tagasi riba püsib ekraani allservas */
.nav{position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-top:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.nav .btn{min-height:48px}
.nav .btn:not(.ghost){padding-inline:28px}
.btn{border:0;background:var(--primary);color:var(--on-primary);font:inherit;font-weight:600;padding:13px 22px;border-radius:12px;cursor:pointer;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* avaleht */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:center;padding-bottom:8px}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-t{display:flex;flex-direction:column;gap:14px;min-width:0}
.props{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.props li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--muted)}
.props b{color:var(--primary);font-weight:700}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:100%}
.collage img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block;background:var(--primary-soft)}
.collage img:nth-child(1){border-radius:60px 14px 14px 14px}
.collage img:nth-child(4){border-radius:14px 14px 60px 14px}
@media (max-width:640px){.collage{grid-template-columns:repeat(4,1fr)}.collage img{border-radius:10px!important}}
.q{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.qh{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4vw,30px);letter-spacing:-.015em;line-height:1.1;margin:0}
.store .lvl{display:block;height:4px;border-radius:2px;background:var(--line);margin:6px 0 2px;overflow:hidden}
.store .lvl i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted);font-size:14px}

/* kokkuvõtte kaardid */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media (max-width:640px){.stats .stat.main{grid-column:1/-1}.stat b{font-size:24px}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat.main{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.75}
.stat b{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat b small{font-family:var(--f-body);font-size:13px;font-weight:500;opacity:.75}
.stat .s{font-size:13.5px;opacity:.8}
.bar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

/* menüü: päevad ja suured fotokaardid */
.days{display:flex;flex-direction:column;gap:22px}
.dayrow{display:flex;flex-direction:column;gap:10px;min-width:0}
.dayrow-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dayrow-h h3{font-family:var(--f-display);font-weight:800;font-size:21px;margin:0;letter-spacing:-.01em}
.dayrow-h span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.mcards{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
@media (max-width:720px){
  .mcards{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
  .mcard{scroll-snap-align:start}}
.mcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:box-shadow .2s,transform .2s}
.mcard:hover{box-shadow:0 10px 24px -14px rgba(0,0,0,.45);transform:translateY(-2px)}
.mphoto{display:block;position:relative;border:0;padding:0;margin:0;background:var(--primary-soft);cursor:pointer;aspect-ratio:4/3;width:100%}
.mphoto img{width:100%;height:100%;object-fit:cover;display:block}
.mslot{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--ink);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 9px;border-radius:999px}
.mbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.mname{border:0;background:none;padding:0;margin:0;font:inherit;font-weight:700;font-size:16px;line-height:1.3;color:var(--ink);text-align:left;cursor:pointer}
.mname:hover{color:var(--primary)}
.mtags{display:flex;flex-wrap:wrap;gap:6px}
.mtags span{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.swap{position:absolute;right:10px;top:10px;border:0;background:var(--surface);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.swap:hover{color:var(--primary)}
.credit{font-size:12.5px;color:var(--muted);margin:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}

/* ostunimekiri */
.shop{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.shop .receipt{grid-column:1;grid-row:1;justify-self:center}
.shop-side{grid-column:2;grid-row:1;position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
@media (max-width:820px){.shop{grid-template-columns:minmax(0,1fr)}.shop-side{grid-column:1;grid-row:1;position:static}.shop .receipt{grid-row:2}}
.progress{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}

.receipt{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:24px 22px 28px;font-family:var(--f-mono);font-size:13.5px;max-width:520px;width:100%;box-shadow:0 6px 18px -10px rgba(0,0,0,.25)}
.receipt .rh{text-align:center;border-bottom:1px dashed var(--muted);padding-bottom:12px;margin-bottom:10px}
.receipt .rh b{font-size:16px;letter-spacing:.1em}
.receipt .cat{margin:14px 0 4px;font-weight:500;color:var(--muted);text-transform:uppercase;font-size:11.5px;letter-spacing:.1em}
.receipt .ln{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:baseline;cursor:pointer;padding:2px 0}
.receipt .ln input{accent-color:var(--primary);margin:0}
.receipt .ln.got span{text-decoration:line-through;color:var(--muted)}
.receipt .qty{font-variant-numeric:tabular-nums;white-space:nowrap}
.receipt .tot{border-top:1px dashed var(--muted);margin-top:16px;padding-top:10px;display:flex;justify-content:space-between;font-weight:500}
.receipt .note{color:var(--muted);font-size:11.5px;margin-top:10px;text-align:center}
.receipt .ln small{grid-column:2/-1;color:var(--muted);font-size:11.5px;margin-top:-2px}
.receipt .pr{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);font-size:12px}


/* retseptiaken */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,14,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
@media (min-width:700px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet .hero{position:relative}
.sheet .hero img{width:100%;height:240px;object-fit:cover;display:block}
.sheet .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.sheet .body{padding:20px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sheet h2{font-size:26px;line-height:1.15;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.macros{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:480px){.macros{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mac{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.mac b{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.mac span{font-size:12px;color:var(--muted)}
.mac i{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.mac i::after{content:"";display:block;height:100%;width:var(--w);background:var(--c,var(--primary))}
.ing{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ing li span:last-child{font-family:var(--f-mono);font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hint{font-size:13.5px;color:var(--muted);margin:0}
/* ostunimekiri: kodus olemas */
.receipt .ln label{cursor:pointer}
.receipt .ln.got label{text-decoration:line-through;color:var(--muted)}
.receipt .ln.have label,.receipt .ln.have .qty{color:var(--muted)}
.receipt .ln.have label{text-decoration:line-through dotted}
.havebtn{border:0;background:none;padding:0 0 0 2px;font:inherit;font-size:11.5px;color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
/* retseptiakna nupud ja toiduvalik */
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:4px;border-top:1px solid var(--line)}
.sheet-actions .btn{flex:1 1 200px}
.chooser-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet .x.static{position:static;flex:none;box-shadow:none;background:var(--bg)}
.pick-q{font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 10px 6px 6px;cursor:pointer;font:inherit}
.pick-item:hover{border-color:var(--primary)}
.pick-item.cur{border-color:var(--accent);background:var(--accent-soft)}
.pick-item img{width:56px;height:56px;object-fit:cover;border-radius:8px;display:block}
.pi-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.pi-t small{color:var(--muted);font-size:12.5px}
.pi-cur{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink)}
/* lüliti */
.toggle{flex-direction:row!important;align-items:flex-start;gap:12px!important;cursor:pointer}
.toggle input{accent-color:var(--primary);width:22px;height:22px;flex:none;margin-top:2px}
.toggle span{display:flex;flex-direction:column;gap:2px}
.toggle small{color:var(--muted);font-size:13.5px}
.person{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px dashed var(--line)}
.person-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.person-h input[type=text]{flex:1 1 160px;min-width:0;font:inherit;font-weight:600;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.kcal-in{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.kcal-in input{width:96px;font:inherit;font-family:var(--f-display);font-weight:700;font-size:18px;padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.chips.small .chip{font-size:13.5px;padding:6px 11px}
.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.how li{padding-left:4px;line-height:1.5}
.how li::marker{font-family:var(--f-display);font-weight:700;color:var(--primary)}
.sheet .note{font-size:12.5px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.page{animation:in .3s ease both}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="wrap" id="wrap">
  <p class="brand">Nädala <span>toiduplaan</span></p>
  <ol class="steps" id="steps"></ol>
  <div id="view"></div>
</div>
<div id="modal" hidden></div>

<script>
// ---------- Poed ja hinnaklassid ----------
// Päris hinnad: Rimi, Selveri ja Barbora (Maxima) e-poest, kogutud tools/collect-prices.js ja
// kirjutatud siia tools/apply-prices.js abil (plokk PRICES). Lidlil ja Coopil e-poodi pole:
// nende hinnad = Rimi hind × hinnanguline hinnatase.
const STORES=[
  {id:"rimi",name:"Rimi",idx:1.00,src:"Rimi e-pood"},{id:"selver",name:"Selver",idx:1.01,src:"Selveri e-pood"},

// vaikimisi 2000 kcal (keskmine täiskasvanu); vanad salvestused, kus eesmärk puudus, saavad samuti 2000
const KCAL_DEFAULT=2000;
function syncPersons(){if(!Array.isArray(S.persons))S.persons=[];while(S.persons.length<S.people)S.persons.push({name:"",kcal:KCAL_DEFAULT});S.persons.length=S.people;S.persons.forEach(p=>{if(!p.kcal)p.kcal=KCAL_DEFAULT})}
syncPersons();
// menüü, ostetud tooted ja avatud leht jäävad alles ka pärast äpi sulgemist
function savePlan(){
  S.plan=plan.map(d=>Object.fromEntries(Object.entries(d).map(([k,r])=>[k,R.indexOf(r)])));
  S.got=[...got]; S.step=step; save();
}
function restorePlan(){
  if(!Array.isArray(S.plan)||S.plan.length!==7)return;
  plan=S.plan.map(d=>Object.fromEntries(Object.entries(d||{}).filter(([,i])=>R[i]).map(([k,i])=>[k,R[i]])));
  got=new Set(S.got||[]);
  if(S.step>=0&&S.step<6)step=S.step;
}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v)return Object.assign(JSON.parse(JSON.stringify(def)),v)}catch(e){}return JSON.parse(JSON.stringify(def))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const store=()=>STORES.find(s=>s.id===S.store)||STORES[0];
const PRICE_DATE=PRICES.date.split("-").reverse().map(Number).join(".");
const realPrices=s=>!!PRICES.stores[s.id];
const storeIdx=s=>PRICES.idx[s.id]??s.idx;
// pakendi hind valitud poes ja hinnaklassis; est = hind on hinnanguline
function packPrice(name,t=tier()){
  const s=store(), own=PRICES.stores[s.id]?.[name];
  if(own) return {p:own[t.ti],est:false};
  const rimi=PRICES.stores.rimi?.[name], f=storeIdx(s);
  if(rimi) return {p:rimi[t.ti]*f,est:realPrices(s)};
  return {p:ING[name][5][t.ti]*f,est:true};
}
const tierOf=id=>TIERS.find(t=>t.id===id)||TIERS[1];
const tier=()=>tierOf(S.tier);
const eur=v=>v.toFixed(2).replace(".",",")+" €";
const num=(v,d=0)=>v.toFixed(d).replace(".",",");
const anySlot=()=>SLOTS.some(([k])=>S.slots[k]);
const slotCount=()=>SLOTS.filter(([k])=>S.slots[k]).length;
// ---------- Kalorieesmärk ----------
// Päeva kalorid jagunevad söögikordade vahel nii; plaanist välja jäetud söögikorra osa jääb plaanist välja.
const SHARE={hommik:.25,louna:.375,ohtu:.375};
const KCAL_PRESETS=[[1600,"1600 · kaalu langetamiseks"],[2000,"2000 · keskmine naine"],[2500,"2500 · keskmine mees"],[3000,"3000 · palju liikumist"]];
const pname=i=>(S.persons[i]?.name||"").trim()||`${i+1}. inimene`;
const anyTarget=()=>S.persons.some(p=>p.kcal>0);
// mitu portsjonit inimene p sellest toidust sööb
function fac(r,k,p){const t=S.persons[p]?.kcal||KCAL_DEFAULT;return Math.min(3,Math.max(.6,t*SHARE[k]/r.mac[0]))}
// kõigi inimeste portsjonid kokku
const pm=(r,k)=>S.persons.reduce((a,_,p)=>a+fac(r,k,p),0);
const mealCost=(r,k)=>price(r)*pm(r,k);
const meals=()=>plan.flatMap(d=>Object.entries(d));
const ready=i=>i===0||(i===1&&!!S.store)||(i===2&&!!S.store&&anySlot())||(i>=3&&!!S.store&&anySlot()&&!!S.tier);

// ---------- Hinnad ----------
// ühe ühiku hind (g, ml või tk) valitud poes ja hinnaklassis
function unitPrice(name,t=tier()){return packPrice(name,t).p/ING[name][4]}
function costOf(r,t=tier()){return r.i.reduce((a,[n,q])=>a+q*unitPrice(n,t),0)}
const price=r=>costOf(r);

function tierEst(t){
  const pool=kind=>{const l=R.filter(r=>r.s===kind&&costOf(r,t)<=t.max);return l.length?l:R.filter(r=>r.s===kind)};
  const avg=(l,f)=>l.reduce((a,r)=>a+f(r),0)/l.length;
  let day=0,portions=0;
  SLOTS.forEach(([k])=>{
    if(!S.slots[k])return;
    const l=pool(k==="hommik"?"hommik":"pea"), c=avg(l,r=>costOf(r,t)), kc=avg(l,r=>r.mac[0]);
    S.persons.forEach(p=>{const f=p.kcal?Math.min(2.2,Math.max(.5,p.kcal*SHARE[k]/kc)):1;day+=c*f;portions++});
  });
  return {portion:day/Math.max(1,portions), day};
}

// ---------- Plaani koostamine ----------
// Kapi põhitooted: neid ei arvestata „ülejääkide ärakasutamise” boonuses
const PANTRY=["oliiviõli","sojakaste","mesi","tšillihelbed","karripulber","garam masala","nisujahu","seesamiseemned","küüslauk","teriyaki kaste"];
const kindOf=k=>k==="hommik"?"hommik":"pea";
const isQuickDay=di=>S.quick&&di<5; // esmaspäev–reede
// kõik toidud, mis sobivad sellele söögikorrale (arvestab „ei söö” valikuid, eelarvet ja kiireid tööpäevi)
function candidates(kind,di){
  const no=Object.keys(S.tastes).filter(k=>S.tastes[k]==="no");
  const likes=Object.keys(S.tastes).filter(k=>S.tastes[k]==="like");
  let list=R.filter(r=>r.s===kind&&!r.t.some(t=>no.includes(t)));
  const inBudget=list.filter(r=>price(r)<=tier().max); if(inBudget.length>=3) list=inBudget;
  if(di!=null&&isQuickDay(di)&&kind==="pea"){const q=list.filter(r=>r.m<=30);if(q.length>=3)list=q}
  return list.map(r=>{
    let w=1+2.5*r.t.filter(t=>likes.includes(t)).length;
    if(S.tier==="premium") w*=1+price(r)/4;
    if(S.tier==="soodne") w*=Math.max(.3,1.7-price(r)/3);
    return {r,w};
  });
}
// have = selle nädala juba kasutatud koostisosad; toidud, mis kasutavad pooleli pakke, saavad eelise
function pick(kind,avoid,di,have){
  const c=candidates(kind,di); if(!c.length) return null;
  let pool=c.filter(x=>!avoid.has(x.r.n)); if(!pool.length) pool=c;
  if(have) pool=pool.map(p=>({r:p.r,w:p.w*(1+.9*Math.min(4,p.r.i.filter(([n])=>have.has(n)&&!PANTRY.includes(n)).length))}));
  // kalorieesmärk: kui toidu portsjonit peaks liiga palju suurendama või vähendama, eelista teisi toite
  const share=kind==="hommik"?SHARE.hommik:SHARE.louna, ts=S.persons.map(p=>p.kcal||KCAL_DEFAULT), hi=Math.max(...ts), lo=Math.min(...ts);
  const fit=pool.map(p=>({r:p.r,w:p.w*((hi*share/p.r.mac[0]>2.4||lo*share/p.r.mac[0]<.65)?.04:1)}));
  if(fit.some(p=>p.w>=pool.find(q=>q.r===p.r).w))pool=fit;
  let x=Math.random()*pool.reduce((a,p)=>a+p.w,0);
  for(const p of pool){x-=p.w;if(x<=0)return p.r} return pool[pool.length-1].r;
}
function weekIngredients(skipDi,skipK){
  const s=new Set();
  plan.forEach((d,di)=>Object.entries(d).forEach(([k,r])=>{if(di!==skipDi||k!==skipK)r.i.forEach(([n])=>s.add(n))}));
  return s;
}
function generate(){
  const used=new Set(), have=new Set(); plan=DAYS.map(()=>({}));
  plan.forEach((d,di)=>SLOTS.forEach(([k])=>{
    if(!S.slots[k]) return;
    const r=pick(kindOf(k),used,di,have);
    if(r){d[k]=r;used.add(r.n);r.i.forEach(([n])=>have.add(n));if(used.size>24)used.clear()}
  }));
  got=new Set(); savePlan();
}
function swap(di,k){
  const avoid=new Set(); plan.forEach(d=>Object.values(d).forEach(r=>avoid.add(r.n)));
  const r=pick(kindOf(k),avoid,di,weekIngredients(di,k)); if(r) plan[di][k]=r;
  savePlan();
}
function setMeal(di,k,r){plan[di][k]=r;savePlan()}

// ---------- Kogused ----------
const FR={.25:"¼",.5:"½",.75:"¾",.3:"⅓"};
function amt(q,u){
  if(u==="tk"){const w=Math.floor(q),f=+(q-w).toFixed(2);return (w?w:"")+(FR[f]||(f?num(f,1).slice(1):""))+(w||f?"":"0")+" tk"}
  if(q>=1000) return num(q/1000,q%1000?1:0)+(u==="g"?" kg":" l");
  return (q<10?num(q,q%1?1:0):Math.round(q))+" "+u;
}
const packSize=g=>g[0]==="tk"?g[4]+" tk":amt(g[4],g[0]);

// Ostunimekiri: kogused nii, nagu poes müüakse
function shopping(){
  const need=new Map();
  meals().forEach(([k,r])=>{const m=pm(r,k);r.i.forEach(([n,q])=>need.set(n,(need.get(n)||0)+q*m))});
  const t=tier();
  return [...need].map(([n,q])=>{
    const g=ING[n], [u,,cat,kind,size,,label,est0]=g, pp=packPrice(n,t), p=pp.p, est=est0&&pp.est||pp.est;
    let buy,cost,count;
    if(kind==="p"){count=Math.max(1,Math.ceil(q/size-0.03));buy=`${count} × ${packSize(g)}`;cost=count*p}
    else if(kind==="pc"){count=Math.max(1,Math.ceil(q-0.05));buy=`${count} tk`;cost=count*p}
    else {const kg=Math.max(.1,Math.ceil(q/100)/10);buy=`~${num(kg,1)} kg`;cost=kg*p}
    return {n,label,cat,buy,cost,need:amt(q,u),est,have:(S.have||[]).includes(n)};
  });
}

// ---------- Retseptiaken ----------
function openRecipe(r,k,di){
  const m=r.mac, n=S.people, tot=pm(r,k);
  const fmtTk=q=>Math.round(q*2)/2;
  const who=anyTarget()?`<div><p class="label">Kes kui palju sööb</p><ul class="ing">${S.persons.map((_,p)=>{const f=fac(r,k,p);return `<li><span>${pname(p)}</span><span>${num(f,1)} portsjonit · ${Math.round(m[0]*f)} kcal · ${Math.round(m[1]*f)} g valku</span></li>`}).join("")}</ul></div>`:"";
  const goal=[700,40,90,25,10]; // võrdlus: hea ühe toidukorra suurus
  const mac=(v,l,u,i,c)=>`<div class="mac"><b>${Math.round(v)}${u}</b><span>${l}</span><i style="--w:${Math.min(100,Math.round(v/goal[i]*100))}%;${c?`--c:${c}`:""}"></i></div>`;
  const el=document.getElementById("modal");
  el.innerHTML=`<div class="modal" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="${r.n}">
    <div class="hero"><img src="${r.img}" alt="${r.n}"><button class="x" data-close aria-label="Sulge">✕</button></div>
    <div class="body">
      <div><h2>${r.n}</h2><div class="facts"><span>⏱ ${r.m} min</span><span>${eur(price(r))} portsjon</span><span>${eur(mealCost(r,k))} ${forN(n)}${anyTarget()?` (${num(tot,1)} portsjonit)`:""}</span></div></div>
      <div><p class="label">Makrod ühe portsjoni kohta</p><div class="macros">
        ${mac(m[0],"kcal","",0)}${mac(m[1],"valk","g",1)}${mac(m[2],"süsivesikud","g",2,"var(--accent)")}${mac(m[3],"rasv","g",3,"var(--no)")}${mac(m[4],"kiudained","g",4)}
      </div></div>
      ${who}
      <div><p class="label">Koostisosad ${forN(n)}</p><ul class="ing">${r.i.map(([x,q])=>{const u=ING[x][0],v=q*tot;return `<li><span>${x[0].toUpperCase()+x.slice(1)}</span><span>${amt(u==="tk"&&v>=1?fmtTk(v):v,u)}</span></li>`}).join("")}</ul>
        <p class="note" style="margin-top:8px">Lisaks sool ja pipar maitse järgi.</p></div>
      <div><p class="label">Valmistamine</p><ol class="how">${r.h.map(s=>`<li>${s}</li>`).join("")}</ol></div>
      ${di!=null?`<div class="sheet-actions"><button class="btn ghost" data-reroll="${di}|${k}">↻ Juhuslik teine toit</button><button class="btn" data-chooser="${di}|${k}">Vali ise teine toit</button></div>`:""}
    </div></div></div>`;
  el.hidden=false; document.body.style.overflow="hidden";
  el.querySelector(".x").focus();
}
// Toidu valimine nimekirjast
function openChooser(di,k){
  const cur=plan[di][k], list=candidates(kindOf(k),di).map(x=>x.r).sort((a,b)=>a.n.localeCompare(b.n,"et"));
  const slotName=Object.fromEntries(SLOTS)[k];
  const el=document.getElementById("modal");
  el.innerHTML=`<div class="modal" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="Vali toit">
    <div class="body">
      <div class="chooser-h"><div><p class="eyebrow">${DAYS[di]} · ${slotName}</p><h2>Vali toit</h2></div><button class="x static" data-close aria-label="Sulge">✕</button></div>
      <input type="search" id="pick-q" class="pick-q" placeholder="Otsi toitu, nt kana, supp, pasta" aria-label="Otsi toitu">
      <p class="hint">${list.length} sobivat toitu${isQuickDay(di)&&k!=="hommik"?" · tööpäeval ainult kuni 30 min":""}</p>
      <div class="pick-list">${list.map(r=>`<button class="pick-item${r===cur?" cur":""}" data-pick="${di}|${k}|${R.indexOf(r)}" data-name="${(r.n+" "+r.i.map(x=>x[0]).join(" ")).toLowerCase()}">
        <img src="${r.img}" alt="" loading="lazy"><span class="pi-t"><b>${r.n}</b><small>${r.m} min · ${Math.round(r.mac[0])} kcal · ${eur(price(r))}/portsjon</small></span>${r===cur?'<span class="pi-cur">praegu</span>':""}</button>`).join("")}</div>
    </div></div></div>`;
  el.hidden=false; document.body.style.overflow="hidden";
  document.getElementById("pick-q").focus();
}
function closeRecipe(){const el=document.getElementById("modal");el.hidden=true;el.innerHTML="";document.body.style.overflow=""}

function render(){
  document.getElementById("wrap").classList.toggle("wide",step>=4);
  document.getElementById("steps").innerHTML=STEPS.map((s,i)=>`<li><button class="${i===step?"cur":i<step?"done":""}" data-go="${i}" ${ready(i)?"":"disabled"} ${i===step?'aria-current="step"':""}>${s}</button></li>`).join("");
  document.getElementById("view").innerHTML=`<section class="page">${PAGES[step]()}</section>`;
}
function go(i){
  if(i<0||i>=STEPS.length||!ready(i)) return;
  if(i>=4&&(step<4||!plan.length)) generate();
  step=i; savePlan(); render(); window.scrollTo({top:0,behavior:"smooth"});
}

// ---------- Sündmused ----------
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")&&(e.target.matches("[data-close]")||e.target.closest(".x"))){closeRecipe();return}
  const o=e.target.closest("[data-open]");
  if(o){const [di,k]=o.dataset.open.split("|");openRecipe(plan[+di][k],k,+di);return}
  const b=e.target.closest("button"); if(!b||b.disabled) return;
  if(b.dataset.reroll){const [di,k]=b.dataset.reroll.split("|");swap(+di,k);render();openRecipe(plan[+di][k],k,+di);return}
  if(b.dataset.chooser){const [di,k]=b.dataset.chooser.split("|");openChooser(+di,k);return}
  if(b.dataset.pick){const [di,k,i]=b.dataset.pick.split("|");setMeal(+di,k,R[+i]);render();openRecipe(R[+i],k,+di);return}
  if(b.dataset.have){const n=b.dataset.have;S.have=S.have||[];S.have=S.have.includes(n)?S.have.filter(x=>x!==n):[...S.have,n];save();render();return}
  if(b.hasAttribute("data-pantry")){const items=shopping().map(x=>x.n).filter(n=>PANTRY.includes(n));S.have=S.have||[];const all=items.every(n=>S.have.includes(n));S.have=all?S.have.filter(n=>!items.includes(n)):[...new Set([...S.have,...items])];save();render();return}
  if(b.dataset.go!==undefined){go(+b.dataset.go);return}
  if(b.dataset.store){S.store=b.dataset.store;save();render();return}
  if(b.dataset.tier){S.tier=b.dataset.tier;save();render();return}
  if(b.dataset.taste){const id=b.dataset.taste,c=S.tastes[id];if(!c)S.tastes[id]="like";else if(c==="like")S.tastes[id]="no";else delete S.tastes[id];save();render();return}
  if(b.dataset.people){S.people=Math.min(10,Math.max(1,S.people+ +b.dataset.people));syncPersons();save();render();return}
  if(b.dataset.kp){const [i,v]=b.dataset.kp.split("|");S.persons[+i].kcal=+v;save();render();return}
  if(b.hasAttribute("data-regen")){generate();render();return}
  if(b.classList.contains("swap")){swap(+b.dataset.d,b.dataset.k);render();return}
  if(b.id==="copy"){
    const txt=shopping().filter(x=>!x.have).map(x=>`☐ ${x.label} – ${x.buy}`).join("\n");
    const fail=()=>{b.textContent="Kopeerimine ei õnnestunud"};
    try{navigator.clipboard.writeText(txt).then(()=>{b.textContent="Kopeeritud ✓";setTimeout(()=>b.textContent="Kopeeri nimekiri",1500)},fail)}catch(err){fail()}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!document.getElementById("modal").hidden) closeRecipe();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches?.("[data-open]")){e.preventDefault();e.target.click()}
});
document.addEventListener("input",e=>{
  if(e.target.id!=="pick-q")return;
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll(".pick-item").forEach(b=>{b.hidden=!!q&&!b.dataset.name.includes(q)});
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.slot){S.slots[t.dataset.slot]=t.checked;save();render()}
  if(t.id==="quick"){S.quick=t.checked;save();render()}
  if(t.dataset.kcal!==undefined){const v=Math.round(+t.value||0);S.persons[+t.dataset.kcal].kcal=v?Math.min(5000,Math.max(1200,v)):KCAL_DEFAULT;save();render()}
  if(t.dataset.name!==undefined){S.persons[+t.dataset.name].name=t.value.trim().slice(0,20);save();render()}
  if(t.dataset.key){
    t.checked?got.add(t.dataset.key):got.delete(t.dataset.key);t.closest(".ln").classList.toggle("got",t.checked);
    const keys=[...document.querySelectorAll(".ln:not(.have) [data-key]")].map(x=>x.dataset.key), n=keys.length, g=keys.filter(x=>got.has(x)).length;
    document.getElementById("gotc").textContent=`Ostetud ${g} / ${n}`;
    document.getElementById("gotb").style.width=Math.round(g/Math.max(1,n)*100)+"%";
    savePlan();
  }
});

restorePlan();
if(!ready(step)||(step>=4&&!plan.length))step=0;
render();

// iPhone'i avakuva-äpp: töötab ka ilma internetita (Claude'i artefaktis seda ei kasutata)
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
